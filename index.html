<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="container-main">
            <div id="container-app">
                <div id="container-heading">
                    <h1>Generate a <span>random password</span</h1>
                    <h2>Never use an insecure password again.</h2>
                </div>
                <div id="container-button">
                    <button id="btn-generate">Generate Password</button>
                    <div id="container-checkboxes">
                        <div class="checkbox-row">
                            <input type="checkbox" id="noNumbers-el">
                            <label for="noNumbers-el">Exclude numbers</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="noSymbols-el">
                            <label for="noSymbols-el">Exclude symbols</label>
                        </div>
                    </div>
                </div>
                <div id="divider">
                </div>
                <div id="container-passwords">
                    <div id="password1-el" class="password">
                    </div>
                    <div id="password2-el" class="password">
                    </div>
                    <p>Click the password to save to clipboard</p>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
